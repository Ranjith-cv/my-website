<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FFC400" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Hex Shield -->
  <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" fill="#080808" stroke="url(#yellowGlow)" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- Cyber Circuit Node Marks -->
  <circle cx="50" cy="6" r="3" fill="#FFD600" />
  <circle cx="90" cy="26" r="3" fill="#FFD600" />
  <circle cx="90" cy="74" r="3" fill="#FFD600" />
  <circle cx="50" cy="94" r="3" fill="#FFD600" />
  <circle cx="10" cy="74" r="3" fill="#FFD600" />
  <circle cx="10" cy="26" r="3" fill="#FFD600" />
  
  <!-- Central Stylized QA Checkmark & Crosshair -->
  <path d="M32 50 L45 63 L70 34" stroke="#FFD600" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="32" stroke="rgba(255, 214, 0, 0.3)" stroke-width="1.5" stroke-dasharray="4 4" />
</svg>
