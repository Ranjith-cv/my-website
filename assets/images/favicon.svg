<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Dark Round Background #101216 -->
  <rect width="48" height="48" rx="14" fill="#101216" />
  
  <!-- Friendly Robot Icon -->
  <g stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antenna -->
    <line x1="24" y1="14" x2="24" y2="8" />
    <circle cx="24" cy="6" r="2.8" fill="#FFFFFF" stroke="none" />
    <!-- Ears -->
    <rect x="6" y="23" width="3" height="7" rx="1.5" fill="#FFFFFF" opacity="0.8" />
    <rect x="39" y="23" width="3" height="7" rx="1.5" fill="#FFFFFF" opacity="0.8" />
    <!-- Head -->
    <rect x="9" y="14" width="30" height="25" rx="8" />
    <!-- Eyes -->
    <ellipse cx="18.5" cy="24.5" rx="2.6" ry="3" fill="#FFFFFF" stroke="none" />
    <ellipse cx="29.5" cy="24.5" rx="2.6" ry="3" fill="#FFFFFF" stroke="none" />
    <!-- Mouth -->
    <path d="M19 31.5 Q24 35 29 31.5" stroke-width="2.4" fill="none" />
    <!-- Cheeks -->
    <circle cx="15" cy="28" r="1.3" fill="#22C55E" opacity="0.9" stroke="none" />
    <circle cx="33" cy="28" r="1.3" fill="#22C55E" opacity="0.9" stroke="none" />
  </g>
</svg>